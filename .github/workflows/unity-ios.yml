name: Unity iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.21f1

permissions:
  contents: read
  actions: read

jobs:
  # ---------- JOB 1: Unity -> Xcode project ----------
  export-xcode:
    name: Export Xcode project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Unity (iOS target)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: MyGame

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  # ---------- JOB 2: Xcode -> unsigned IPA ----------
  build-ipa:
    name: Build unsigned IPA
    needs: export-xcode
    runs-on: macos-26-intel
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="xcode-project") | .id')
          echo "Artifact ID: $ARTIFACT_ID"
          rm -rf xcode-project xcode-project.zip
          mkdir -p xcode-project
          curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
               --connect-timeout 30 --max-time 600 \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -o xcode-project.zip \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          unzip -q xcode-project.zip -d xcode-project
          rm -f xcode-project.zip
          ls -la xcode-project

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version

      - name: Fix permissions on Unity-generated scripts
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          echo "Project dir: $PROJECT_DIR"
          chmod +x "$PROJECT_DIR/MapFileParser.sh" || true

      - name: Link UnityFramework into app target
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          PBXPROJ="$PROJECT_DIR/Unity-iPhone.xcodeproj/project.pbxproj"
          python3 - "$PBXPROJ" <<'PY'
          import re, sys, shutil
          pbx = sys.argv[1]
          shutil.copy2(pbx, pbx + '.bak')
          NEW_GUID = '9D25ABB0213FB47800354C27'
          NEW_BUILDFILE_LINE = f'\t\t{NEW_GUID} /* UnityFramework.framework in Frameworks */ = {{isa = PBXBuildFile; fileRef = 9D25AB9D213FB47800354C27 /* UnityFramework.framework */; }};\n'
          data = open(pbx).read()
          tm = re.search(r'([A-Z0-9]{24}) /\* Unity-iPhone \*/ = \{', data)
          if not tm:
              print("ERROR: Unity-iPhone target not found"); sys.exit(1)
          tstart = tm.end()
          bpm = re.search(r'buildPhases = \(', data[tstart:])
          if not bpm:
              print("ERROR: buildPhases not found"); sys.exit(1)
          bp_paren = tstart + bpm.start() + len('buildPhases = (') - 1
          depth = 0
          i = bp_paren
          while i < len(data):
              if data[i] == '(': depth += 1
              elif data[i] == ')':
                  depth -= 1
                  if depth == 0:
                      break
              i += 1
          phases_list = data[bp_paren+1:i]
          phase_guids = re.findall(r'([A-Z0-9]{24}) /\* Frameworks \*/', phases_list)
          if not phase_guids:
              print("ERROR: no Frameworks phase in Unity-iPhone target"); sys.exit(1)
          fw_guid = phase_guids[0]
          print(f"Unity-iPhone Frameworks phase GUID: {fw_guid}")
          pm = re.search(re.escape(fw_guid) + r' /\* Frameworks \*/ = \{([^}]*)\};', data)
          if not pm:
              print("ERROR: Frameworks phase block not found"); sys.exit(1)
          phase_inner = pm.group(1)
          if 'UnityFramework.framework in Frameworks' in phase_inner:
              print("Already linked; no change needed.")
          else:
              def repl_files(m):
                  indent = '\t\t\t'
                  inner_ws = m.group(1)
                  entry = f'{NEW_GUID} /* UnityFramework.framework in Frameworks */'
                  if inner_ws.strip() == '':
                      return f'files = (\n{indent}{entry},\n{indent});'
                  else:
                      return f'files = ({inner_ws.rstrip()},\n{indent}{entry});'
              new_inner = re.sub(r'files = \((\s*)\);', repl_files, phase_inner, count=1)
              if new_inner == phase_inner:
                  new_inner = phase_inner.replace(');', f',\n\t\t\t{NEW_GUID} /* UnityFramework.framework in Frameworks */);', 1)
              new_block = pm.group(0).replace(phase_inner, new_inner, 1)
              data = data.replace(pm.group(0), new_block, 1)
              print("Added UnityFramework.framework to Unity-iPhone Frameworks build phase.")
          buildfile_present = bool(re.search(
              re.escape(NEW_GUID) + r' /\* UnityFramework.framework in Frameworks \*/ = \{isa = PBXBuildFile;', data))
          anchor = '\t\t9D25ABA5213FB47800354C27 /* UnityFramework.framework in Embed Frameworks */ = '
          if not buildfile_present and anchor in data:
              data = data.replace(anchor, NEW_BUILDFILE_LINE + anchor, 1)
              print("Added PBXBuildFile entry.")
          elif buildfile_present:
              print("PBXBuildFile entry already present.")
          else:
              data = data.replace('/* End PBXBuildFile section */', NEW_BUILDFILE_LINE + '/* End PBXBuildFile section */', 1)
          open(pbx, 'w').write(data)
          print("DONE")
          PY

      - name: Archive (unsigned)
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          cd "$PROJECT_DIR"
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/MyGame.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SUPPORTED_PLATFORMS=iphoneos \
            PLATFORM_NAME=iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/MyGame.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "No .app found"; exit 1; fi
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr BBTUD-iOS-port-unsigned.ipa Payload
          ls -lh BBTUD-iOS-port-unsigned.ipa

      - name: Verify it is a real iOS device build (arm64, not simulator)
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name "*.app" | head -1)
          BIN_NAME=$(plutil -p "$APP_PATH/Info.plist" | sed -n 's/.*CFBundleExecutable" => "\(.*\)"/\1/p')
          BIN="$APP_PATH/$BIN_NAME"
          echo "Binary: $BIN"
          file "$BIN"
          vtool -show-build "$BIN" | grep -iE "platform|minos|sdk"
          if vtool -show-build "$BIN" | grep -qi "IOSSIMULATOR"; then
            echo "ERROR: build is for iOS Simulator, not a real device"
            exit 1
          fi
          lipo -info "$BIN" | grep -q arm64 || { echo "ERROR: not arm64"; exit 1; }
          if otool -L "$BIN" | grep -q "UnityFramework"; then
            echo "OK: links UnityFramework"
          else
            echo "ERROR: executable does NOT link UnityFramework.framework"
            otool -L "$BIN"
            exit 1
          fi
          echo "OK: arm64 iOS device build"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7