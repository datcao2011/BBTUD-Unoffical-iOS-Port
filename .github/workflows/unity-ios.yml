name: Unity iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.21f1

permissions:
  contents: read
  actions: read

jobs:
  # ---------- JOB 1: Unity -> Xcode project ----------
  export-xcode:
    name: Export Xcode project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Unity (iOS target)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: MyGame

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  # ---------- JOB 2: Xcode -> unsigned IPA ----------
  build-ipa:
    name: Build unsigned IPA
    needs: export-xcode
    runs-on: macos-26-intel
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="xcode-project") | .id')
          echo "Artifact ID: $ARTIFACT_ID"
          rm -rf xcode-project xcode-project.zip
          mkdir -p xcode-project
          curl -L --fail --retry 5 --retry-delay 5 --retry-all-errors \
               --connect-timeout 30 --max-time 600 \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -o xcode-project.zip \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          unzip -q xcode-project.zip -d xcode-project
          rm -f xcode-project.zip
          ls -la xcode-project

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version

      - name: Fix permissions on Unity-generated scripts
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          echo "Project dir: $PROJECT_DIR"
          chmod +x "$PROJECT_DIR/MapFileParser.sh" || true

      - name: Link UnityFramework + libiPhone-lib into app target
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          PBXPROJ="$PROJECT_DIR/Unity-iPhone.xcodeproj/project.pbxproj"
          python3 - "$PBXPROJ" <<'PY'
          import re, sys, shutil
          pbx = sys.argv[1]
          shutil.copy2(pbx, pbx + '.bak')
          # (new_pbxbuildfile_guid, fileRef_guid, display_name, comment)
          ADD = [
              ('9D25ABB0213FB47800354C27', '9D25AB9D213FB47800354C27', 'UnityFramework.framework', 'UnityFramework.framework in Frameworks'),
              ('9D25ABB1213FB47800354C27', '4DC089211278CC7792F1893F', 'libiPhone-lib.dylib', 'libiPhone-lib.dylib in Frameworks'),
          ]
          data = open(pbx).read()
          # 1. Locate Unity-iPhone target Frameworks phase GUID
          tm = re.search(r'([A-Z0-9]{24}) /\* Unity-iPhone \*/ = \{', data)
          if not tm:
              print("ERROR: Unity-iPhone target not found"); sys.exit(1)
          tstart = tm.end()
          bpm = re.search(r'buildPhases = \(', data[tstart:])
          if not bpm:
              print("ERROR: buildPhases not found"); sys.exit(1)
          bp_paren = tstart + bpm.start() + len('buildPhases = (') - 1
          depth = 0; i = bp_paren
          while i < len(data):
              if data[i] == '(': depth += 1
              elif data[i] == ')':
                  depth -= 1
                  if depth == 0: break
              i += 1
          phases_list = data[bp_paren+1:i]
          fw_guids = re.findall(r'([A-Z0-9]{24}) /\* Frameworks \*/', phases_list)
          if not fw_guids:
              print("ERROR: no Frameworks phase in Unity-iPhone target"); sys.exit(1)
          fw_guid = fw_guids[0]
          # 2. Append files entries to that Frameworks phase
          pm = re.search(re.escape(fw_guid) + r' /\* Frameworks \*/ = \{([^}]*)\};', data)
          if not pm:
              print("ERROR: Frameworks phase block not found"); sys.exit(1)
          phase_inner = pm.group(1)
          to_add = [(ng, c) for ng, frg, n, c in ADD if f'{n} in Frameworks' not in phase_inner]
          if to_add:
              indent = '\t\t\t'
              entries = '\n'.join(f'{indent}{ng} /* {c} */,' for ng, c in to_add)
              def repl_files(m):
                  ws = m.group(1)
                  if ws.strip() == '':
                      return f'files = (\n{entries}\n{indent});'
                  return f'files = ({ws.rstrip()},\n{entries}\n{indent});'
              new_inner = re.sub(r'files = \((\s*)\);', repl_files, phase_inner, count=1)
              if new_inner == phase_inner:
                  new_inner = phase_inner.replace(');', ',\n' + entries + '\n' + indent + ');', 1)
              data = data.replace(pm.group(0), pm.group(0).replace(phase_inner, new_inner, 1), 1)
              print(f"Added {len(to_add)} framework(s) to Unity-iPhone Frameworks phase.")
          else:
              print("All frameworks already in Frameworks phase.")
          # 3. Add PBXBuildFile entries
          anchor = '\t\t9D25ABA5213FB47800354C27 /* UnityFramework.framework in Embed Frameworks */ = '
          new_bf = ''
          for ng, frg, n, c in ADD:
              if not re.search(re.escape(ng) + r' /\* ' + c + r' \*/ = \{isa = PBXBuildFile;', data):
                  new_bf += f'\t\t{ng} /* {c} */ = {{isa = PBXBuildFile; fileRef = {frg} /* {n} */; }};\n'
          if new_bf:
              if anchor in data:
                  data = data.replace(anchor, new_bf + anchor, 1)
              else:
                  data = data.replace('/* End PBXBuildFile section */', new_bf + '/* End PBXBuildFile section */', 1)
              print("Added PBXBuildFile entry(ies).")
          else:
              print("All PBXBuildFile entries already present.")
          open(pbx, 'w').write(data)
          print("DONE")
          PY

      - name: Archive (unsigned)
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          cd "$PROJECT_DIR"
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/MyGame.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SUPPORTED_PLATFORMS=iphoneos \
            PLATFORM_NAME=iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/MyGame.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "No .app found"; exit 1; fi
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          # libiPhone-lib.dylib is @loader_path-based; main exe loader_path = .app root.
          # Copy it next to the main executable so UnityPLCrashReporter symbols resolve.
          DYNLIB="$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")/Frameworks/UnityFramework.framework/libiPhone-lib.dylib"
          if [ -f "$DYNLIB" ]; then
            cp -f "$DYNLIB" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")/libiPhone-lib.dylib"
            echo "Copied libiPhone-lib.dylib to .app root"
          else
            echo "WARNING: libiPhone-lib.dylib not found in framework"; exit 1
          fi
          cd "$RUNNER_TEMP/ipa"
          zip -qr BBTUD-iOS-port-unsigned.ipa Payload
          ls -lh BBTUD-iOS-port-unsigned.ipa

      - name: Verify it is a real iOS device build (arm64, not simulator)
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name "*.app" | head -1)
          BIN_NAME=$(plutil -p "$APP_PATH/Info.plist" | sed -n 's/.*CFBundleExecutable" => "\(.*\)"/\1/p')
          BIN="$APP_PATH/$BIN_NAME"
          echo "Binary: $BIN"
          file "$BIN"
          vtool -show-build "$BIN" | grep -iE "platform|minos|sdk"
          if vtool -show-build "$BIN" | grep -qi "IOSSIMULATOR"; then
            echo "ERROR: build is for iOS Simulator, not a real device"
            exit 1
          fi
          lipo -info "$BIN" | grep -q arm64 || { echo "ERROR: not arm64"; exit 1; }
          if otool -L "$BIN" | grep -q "libiPhone-lib"; then
            echo "OK: links libiPhone-lib.dylib"
          else
            echo "ERROR: executable does NOT link libiPhone-lib.dylib"
            otool -L "$BIN"
            exit 1
          fi
          echo "OK: arm64 iOS device build"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7
