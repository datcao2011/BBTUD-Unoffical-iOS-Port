name: Unity iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.21f1

jobs:
  # ---------- JOB 1: Unity -> Xcode project ----------
  export-xcode:
    name: Export Xcode project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Build Unity (iOS target)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: MyGame

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  # ---------- JOB 2: Xcode -> unsigned IPA ----------
  build-ipa:
    name: Build unsigned IPA
    needs: export-xcode
    runs-on: macos-26-intel
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xcode-project

      - name: Show Xcode version
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version

      - name: Fix permissions on Unity-generated scripts
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          echo "Project dir: $PROJECT_DIR"
          chmod +x "$PROJECT_DIR/MapFileParser.sh" || true

      - name: Archive (unsigned)
        run: |
          PROJECT_DIR=$(dirname "$(find xcode-project -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)")
          cd "$PROJECT_DIR"
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MyGame.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/MyGame.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "No .app found"; exit 1; fi
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr MyGame-unsigned.ipa Payload
          ls -lh MyGame-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7